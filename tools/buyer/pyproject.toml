[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-local-buyer"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["benchmark-local-commerce==0.2.0"]

[tool.setuptools]
