[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-local-commerce"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.23,<2", "filelock>=3.20,<5", "pydantic>=2.11,<3", "typing-extensions>=4.12"]

[tool.setuptools]
packages = ["local_commerce"]
license-files = ["licenses/*.txt"]

[tool.setuptools.package-dir]
local_commerce = "local_commerce"

[tool.setuptools.package-data]
local_commerce = ["EXTRACTION.json"]
