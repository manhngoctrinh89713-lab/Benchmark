[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-local-files"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.23,<2", "filelock>=3.20,<5", "markitdown[docx,pdf,pptx,xlsx,xls]==0.1.9", "Pillow>=10,<14", "openpyxl>=3.1,<4"]

[tool.setuptools]
packages = ["local_files", "local_files.api", "local_files.api.append_file", "local_files.api.compare_files", "local_files.api.copy_file", "local_files.api.create_archive", "local_files.api.create_directory", "local_files.api.delete_file", "local_files.api.delete_trash", "local_files.api.directory_tree", "local_files.api.edit_file", "local_files.api.extract_archive", "local_files.api.get_file_info", "local_files.api.list_allowed_directories", "local_files.api.list_archive", "local_files.api.list_directory", "local_files.api.list_trash", "local_files.api.move_file", "local_files.api.read_binary_file", "local_files.api.read_document", "local_files.api.read_multiple_files", "local_files.api.restore_trash", "local_files.api.search_content", "local_files.api.search_files", "local_files.api.trash_file", "local_files.api.write_binary_file", "local_files.api.write_file", "local_files.api.get_workbook_info", "local_files.api.read_spreadsheet", "local_files.api.write_spreadsheet"]
license-files = ["公用代码/licenses/*.txt"]

[tool.setuptools.package-dir]
local_files = "公用代码/local_files"
"local_files.api" = "工具调用API"

[tool.setuptools.package-data]
local_files = ["EXTRACTION.json"]
"local_files.api" = ["*/schema.json"]
